<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>MOTION SIGNAL — Motion Design Intelligence</title><style>
:root{color-scheme:dark;--bg:#0b0f15;--surface:#141b25;--surface2:#1a2330;--stroke:#2a3544;--text:#edf2f7;--muted:#9baaba;--accent:#f1ae66;--green:#80d5af}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,'Helvetica Neue',Arial,'Noto Sans JP',sans-serif}button,input,select{font:inherit}button{cursor:pointer}.shell{display:grid;grid-template-columns:240px minmax(0,1fr);min-height:100vh}.sidebar{border-right:1px solid var(--stroke);padding:30px 17px;position:sticky;top:0;height:100vh;display:flex;flex-direction:column}.logo{display:flex;gap:12px;align-items:center;padding:5px 8px 35px}.logo-icon{font-size:30px;color:var(--accent)}.brand{font-size:17px;font-weight:800;letter-spacing:.08em}.brand-sub{font-size:10px;letter-spacing:.19em;color:var(--muted);margin-top:3px}.nav{display:grid;gap:7px}.nav button{background:transparent;color:var(--muted);border:1px solid transparent;text-align:left;border-radius:9px;padding:12px;font-size:14px}.nav button.active{background:#252d37;color:#fff;border-color:#3b4653}.nav button:hover{color:#fff}.nav span{display:inline-block;width:29px;font-size:17px;color:var(--accent)}.sidefoot{margin-top:auto;border-top:1px solid var(--stroke);padding:20px 9px;font-size:12px;color:var(--muted);line-height:1.7}.status{color:var(--green)}main{padding:38px min(5vw,76px) 80px;max-width:1460px;width:100%;margin:auto}.eyebrow{font-size:11px;letter-spacing:.2em;color:var(--accent);font-weight:700}.hero{display:flex;justify-content:space-between;align-items:flex-end;gap:15px}.hero h1{font-size:clamp(28px,4vw,47px);margin:11px 0 7px;font-weight:730;letter-spacing:-.045em}.hero p{font-size:14px;color:var(--muted);margin:0;line-height:1.8}.refresh{border:1px solid var(--stroke);background:var(--surface);color:var(--text);border-radius:9px;padding:12px 15px;white-space:nowrap}.refresh:hover{border-color:var(--accent)}.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;margin:30px 0}.stat{background:var(--surface);border:1px solid var(--stroke);border-radius:12px;padding:22px}.stat .label{color:var(--muted);font-size:12px}.stat strong{display:block;font-size:28px;margin-top:10px;letter-spacing:-.05em}.stat small{color:var(--accent);font-size:11px;margin-left:8px;font-weight:400}.toolbar{display:flex;flex-wrap:wrap;align-items:center;gap:12px;margin:32px 0 18px}.tabs{display:flex;gap:7px;flex-wrap:wrap}.tabs button,.filter{background:#17202b;border:1px solid var(--stroke);border-radius:8px;color:var(--muted);padding:10px 13px;font-size:12px}.tabs button.active{background:#362c26;border-color:#82593a;color:#ffc58f}.search{flex:1;min-width:180px;background:#17202b;border:1px solid var(--stroke);color:#fff;border-radius:8px;padding:10px 13px;outline:0}.search:focus{border-color:#d19154}.summary{display:flex;justify-content:space-between;align-items:center;gap:12px;color:var(--muted);font-size:12px;margin-bottom:14px}.summary h2{color:var(--text);font-size:19px;font-weight:700;margin:0}.cards{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:15px}.article{min-width:0;background:var(--surface);border:1px solid var(--stroke);border-radius:13px;padding:23px;display:flex;flex-direction:column;gap:13px;transition:border .15s}.article:hover{border-color:#697585}.meta{display:flex;align-items:center;gap:8px;flex-wrap:wrap;font-size:11px;color:var(--muted)}.tag{color:#ffd0a0;background:#423024;padding:5px 8px;border-radius:5px;font-weight:700}.score{margin-left:auto;color:var(--green);font-weight:700}.article h3{font-size:18px;line-height:1.55;letter-spacing:-.01em;margin:0}.desc{color:#b1bdc9;font-size:13px;line-height:1.85;margin:0}.details{font-size:12px;color:#ced6df;line-height:1.8;background:var(--surface2);border-radius:8px;padding:12px}.details b{color:var(--accent)}.foot{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-top:auto;padding-top:4px}.source{color:var(--muted);font-size:12px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.actions{display:flex;gap:8px;flex-shrink:0}.actions button,.actions a{border:1px solid #384556;border-radius:7px;background:#1c2733;color:#eee;padding:8px 11px;text-decoration:none;font-size:12px}.actions button.saved{color:#f8bf77;border-color:#a5794a}.empty{padding:50px;text-align:center;color:var(--muted);grid-column:1/-1;border:1px dashed var(--stroke);border-radius:12px}.banner{margin-top:20px;background:#1c2830;border-left:3px solid var(--accent);color:#bfcbd6;padding:14px 17px;font-size:12px;line-height:1.8;border-radius:5px}.hidden{display:none!important}@media(max-width:920px){.shell{grid-template-columns:1fr}.sidebar{height:auto;position:static;padding:13px 18px;border-right:0;border-bottom:1px solid var(--stroke)}.logo{padding:2px 0 12px}.nav{display:flex;overflow:auto}.nav button{white-space:nowrap;padding:8px}.sidefoot{display:none}main{padding:30px 18px}.cards{grid-template-columns:1fr}}@media(max-width:570px){.stats{grid-template-columns:1fr 1fr;gap:8px}.stat{padding:15px}.stat:last-child{grid-column:1/-1}.hero{align-items:flex-start}.hero h1{font-size:30px}.refresh{padding:9px}.article{padding:17px}}
</style></head><body><div class="shell"><aside class="sidebar"><div class="logo"><div class="logo-icon">◉</div><div><div class="brand">MOTION SIGNAL</div><div class="brand-sub">CREATIVE INTELLIGENCE</div></div></div><div class="nav" id="nav"><button data-nav="all" class="active"><span>◫</span> すべての情報</button><button data-nav="tools"><span>⌘</span> AE・ツール</button><button data-nav="design"><span>◈</span> モーションデザイン</button><button data-nav="ai"><span>✳</span> 映像制作AI</button><button data-nav="saved"><span>☆</span> 保存した情報</button></div><div class="sidefoot"><div id="mode">● 初回収集待ち</div><div>更新設定：毎日 9:00 JST</div><div>Version 0.2 — Free edition</div></div></aside><main><div class="eyebrow">DISCOVER WHAT MOVES NEXT.</div><div class="hero"><div><h1>Find the signal.</h1><p>モーションデザインの「今」を捉える。<br>本当に役立つ制作情報だけを、ひとつの場所に。</p></div><button class="refresh" id="reload">↻ 更新</button></div><section class="stats"><div class="stat"><div class="label">収集済み情報</div><strong id="total">—<small>件</small></strong></div><div class="stat"><div class="label">注目度の高い情報</div><strong id="high">—<small>80点以上</small></strong></div><div class="stat"><div class="label">保存済み</div><strong id="saved">—<small>件</small></strong></div></section><div class="toolbar"><div class="tabs" id="tabs"><button data-tab="all" class="active">すべて</button><button data-tab="tools">AE・ツール</button><button data-tab="design">デザイン</button><button data-tab="ai">AI活用</button></div><input class="search" id="search" type="search" placeholder="キーワードで検索..." aria-label="キーワード検索"><select class="filter" id="sort" aria-label="並べ替え"><option value="recent">新着順</option><option value="score">スコア順</option></select></div><div class="summary"><h2 id="heading">最新のシグナル</h2><span id="count"></span></div><div class="cards" id="cards"></div><div class="banner" id="notice">公開RSSの記事を毎日収集します。各記事の評価は自動生成されるため、一次情報で確認してください。Xの全投稿収集には対応していません。</div></main></div><script>
const demo=[];
let articles=demo,view='all',tab='all';const storage='motion-signal-bookmarks-v1';let bookmarks;try{bookmarks=JSON.parse(localStorage.getItem(storage)||'[]')}catch{bookmarks=[]}const $=id=>document.getElementById(id);const labels={all:'最新のシグナル',tools:'AE・ツール',design:'モーションデザイン',ai:'映像制作AI',saved:'保存した情報'};const categoryLabels={tools:'AE・ツール',design:'デザイン',ai:'AI活用'};function escapeHTML(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}function visible(){const q=$('search').value.trim().toLowerCase();return articles.filter(a=>(view==='saved'?bookmarks.includes(a.id):view==='all'||a.category===view)&&(!q||[a.title,a.summary,a.use_case,a.source].join(' ').toLowerCase().includes(q))).sort((a,b)=>$('sort').value==='score'?b.score-a.score:Date.parse(b.published||0)-Date.parse(a.published||0))}function render(){const list=visible();$('total').innerHTML=articles.length+'<small>件</small>';$('high').innerHTML=articles.filter(a=>a.score>=80).length+'<small>80点以上</small>';$('saved').innerHTML=bookmarks.length+'<small>件</small>';$('heading').textContent=labels[view];$('count').textContent=list.length+'件を表示';$('cards').innerHTML=list.length?list.map(a=>`<article class="article"><div class="meta"><span class="tag">${categoryLabels[a.category]||'情報'}</span><span>${escapeHTML(a.published?a.published.slice(0,10):'')}</span><span class="score">◆ ${Number(a.score)||0}/100</span></div><h3>${escapeHTML(a.title)}</h3><p class="desc">${escapeHTML(a.summary)}</p><div class="details"><b>制作への活用</b>　${escapeHTML(a.use_case||'未評価')}<br><b>注意点</b>　${escapeHTML(a.caution||'元の情報を確認してください')}</div><div class="foot"><span class="source">${escapeHTML(a.source||'不明')}${a.evaluation==='gemini'?' · AI評価':' · 自動判定'}</span><div class="actions"><button class="${bookmarks.includes(a.id)?'saved':''}" data-save="${escapeHTML(a.id)}" aria-label="保存">${bookmarks.includes(a.id)?'★ 保存済':'☆ 保存'}</button>${a.url&&/^https?:\/\//.test(a.url)?`<a href="${escapeHTML(a.url)}" target="_blank" rel="noopener noreferrer">元記事 ↗</a>`:''}</div></div></article>`).join(''):'<div class="empty">条件に合う記事がありません。検索語やカテゴリーを変更してください。</div>';document.querySelectorAll('[data-save]').forEach(b=>b.onclick=()=>{const id=b.dataset.save;bookmarks=bookmarks.includes(id)?bookmarks.filter(x=>x!==id):[...bookmarks,id];localStorage.setItem(storage,JSON.stringify(bookmarks));render()})}function setView(v){view=v;document.querySelectorAll('[data-nav]').forEach(b=>b.classList.toggle('active',b.dataset.nav===v));document.querySelectorAll('[data-tab]').forEach(b=>b.classList.toggle('active',b.dataset.tab===v));render()}document.querySelectorAll('[data-nav]').forEach(b=>b.onclick=()=>setView(b.dataset.nav));document.querySelectorAll('[data-tab]').forEach(b=>b.onclick=()=>setView(b.dataset.tab));$('search').oninput=render;$('sort').onchange=render;async function load(){try{const r=await fetch('./data/articles.json?ts='+Date.now(),{cache:'no-store'});if(!r.ok)throw Error('API unavailable');const data=await r.json();if(!Array.isArray(data.articles))throw Error('invalid API');articles=data.articles;$('mode').textContent=data.generated_at?'● RSS最終更新: '+new Date(data.generated_at).toLocaleString('ja-JP',{timeZone:'Asia/Tokyo'}):'● 初回収集待ち';$('mode').className='status';$('notice').textContent=(data.notice||'RSS収集情報です。')+' ・ AI評価: '+data.articles.filter(a=>a.evaluation==='gemini').length+'件 / 自動キーワード評価: '+data.articles.filter(a=>a.evaluation!=='gemini').length+'件';}catch{articles=demo;$('mode').textContent='● 初回収集待ち'}render()}$('reload').onclick=load;load();
</script></body></html>
